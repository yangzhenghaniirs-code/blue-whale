# blue whale：桌宠连 18100 端口；DSH 打开时自动叫出桌宠（第一次会自动下载桌宠程序）
- insert:
    - id: bluewhale
      name: '@yangzhenghan/dsh-bluewhale'
      config:
        port: 18100
        autoLaunchPet: true
        ruleMode: tag
    # 开关：DSH 插件页里打开它 = 每句附上桌宠规则（prompt）；关上 = 只带标签（tag）
    - id: bluewhale-prompt-rules
      name: '@yangzhenghan/dsh-bluewhale/prompt-rules'
      disabled: true
      config: {}
